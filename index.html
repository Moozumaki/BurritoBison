<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline';">
    <meta name="theme-color" content="#101114">
    <title>Burrito Bison</title>
    <link rel="stylesheet" href="style.css">
    <script src="UnityProgress.js" defer></script>
    <script src="burrito-bison-ll.js" defer></script>
    <script src="kongregate_api.js" defer></script>
    <script src="kongregate-standalone.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <div class="game-frame">
        <div id="gameContainer" aria-label="Burrito Bison game"></div>
        <button class="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M3 16v5h5m13-5v5h-5" />
          </svg>
        </button>
      </div>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var gameInstance = UnityLoader.instantiate("gameContainer", "burrito-bison-ll.json", {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function() {
              UnityProgress(gameInstance, 1);
            }
          }
        });
        document.querySelector(".fullscreen-button").addEventListener("click", function() {
          gameInstance.SetFullscreen(1);
        });
      });
    </script>
  </body>
</html>
